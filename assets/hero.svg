<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Nick Cao — interfaces, systems, intelligence</title>
  <desc id="desc">A midnight-blue developer workbench. Mint and blue signals move through a circuit linking UI, API and AI.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#293747"/></pattern>
    <linearGradient id="bg" x2="880" y2="310" gradientUnits="userSpaceOnUse"><stop stop-color="#0d1725"/><stop offset="1" stop-color="#101e2c"/></linearGradient>
    <linearGradient id="signal"><stop stop-color="#a8f0c6"/><stop offset="1" stop-color="#75bfff"/></linearGradient>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}
      .signal{stroke-dasharray:12 210;animation:flow 8s linear infinite}
      .return{animation-direction:reverse;animation-duration:10s}
      .cursor{animation:blink 1.6s steps(2,jump-none) infinite}
      .ring{transform-origin:704px 157px;animation:orbit 50s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-444}}
      @keyframes blink{50%{opacity:.15}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.signal,.cursor,.ring{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="878" height="308" rx="18" fill="url(#bg)" stroke="#304253"/>
  <rect x="510" y="42" width="350" height="234" fill="url(#grid)"/>
  <path d="M1 43H879" stroke="#2a3949"/>
  <circle cx="23" cy="23" r="4" fill="#d3a194"/><circle cx="39" cy="23" r="4" fill="#d9c38d"/><circle cx="55" cy="23" r="4" fill="#a8d9b4"/>
  <text x="80" y="28" class="mono" font-size="12" fill="#a3b3c6">~/nick / workbench</text>
  <text x="840" y="28" text-anchor="end" class="mono" font-size="11" fill="#a3b3c6">PROFILE / 01</text>
  <text x="40" y="91" class="mono" font-size="14" letter-spacing="3" fill="#a8f0c6">HELLO, WORLD.</text>
  <text x="35" y="172" font-size="78" font-weight="700" letter-spacing="-4" fill="#f1f5f9">Nick Cao<tspan fill="#a8f0c6">.</tspan></text>
  <text x="40" y="210" font-size="21" fill="#b5c8dc">Interfaces. Systems. Intelligence.</text>
  <path d="M40 240H460" stroke="#2c4053"/>
  <text x="40" y="272" class="mono" font-size="13" fill="#a8f0c6">&gt;</text>
  <text x="60" y="272" class="mono" font-size="13" fill="#b5c8dc">turn curiosity into something useful</text>
  <rect class="cursor" x="342" y="260" width="7" height="15" fill="#a8f0c6"/>
  <circle cx="704" cy="157" r="84" stroke="#273e51"/>
  <circle class="ring" cx="704" cy="157" r="100" stroke="#46657a" stroke-dasharray="3 16"/>
  <path d="M555 120H610L642 157H704M555 211H610L642 157M704 157H767L802 108M704 157H763L802 222" stroke="#36546a" stroke-width="2"/>
  <path class="signal" d="M555 120H610L642 157H704H767L802 108" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
  <path class="signal return" d="M555 211H610L642 157H704H763L802 222" stroke="#a8f0c6" stroke-width="3" stroke-linecap="round"/>
  <rect x="669" y="122" width="70" height="70" rx="16" fill="#182c3a" stroke="#a8f0c6"/>
  <text x="704" y="168" text-anchor="middle" class="mono" font-size="28" font-weight="700" fill="#a8f0c6">NC</text>
  <g fill="#122332" stroke="#46657a"><rect x="523" y="103" width="58" height="34" rx="8"/><rect x="523" y="194" width="58" height="34" rx="8"/><rect x="773" y="91" width="58" height="34" rx="8"/><rect x="773" y="205" width="58" height="34" rx="8"/></g>
  <g class="mono" font-size="13" text-anchor="middle" fill="#c7d8e9"><text x="552" y="125">UI</text><text x="552" y="216">API</text><text x="802" y="113">AI</text><text x="802" y="227">SHIP</text></g>
</svg>
