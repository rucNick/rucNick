name: Refresh contribution snake

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'rucNick/rucNick'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%232c8c69
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23a8f0c6

      - name: Respect reduced motion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          namespace = 'http://www.w3.org/2000/svg'
          ET.register_namespace('', namespace)
          for path in Path('dist').glob('*.svg'):
              tree = ET.parse(path)
              style = ET.SubElement(tree.getroot(), f'{{{namespace}}}style')
              style.text = '@media(prefers-reduced-motion:reduce){*{animation:none!important}}'
              tree.write(path, encoding='unicode')
          PY

      - name: Publish generated SVGs to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          cd dist
          git init --initial-branch=output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GH_REPO}.git"
          gh auth setup-git
          if git ls-remote --exit-code --heads origin output >/dev/null; then
            git fetch --depth=1 origin output
            git reset --soft FETCH_HEAD
          fi
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Contribution graph is unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh contribution snake'
          git push origin HEAD:output
